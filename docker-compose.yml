services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sparsh-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=4000
      - NODE_ENV=production
    networks:
      - sparsh-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sparsh-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - sparsh-network

networks:
  sparsh-network:
    driver: bridge
