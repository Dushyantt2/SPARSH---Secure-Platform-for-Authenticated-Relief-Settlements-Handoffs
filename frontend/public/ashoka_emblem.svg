<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="#0B3D91">
  <!-- Base/Abacus -->
  <rect x="30" y="195" width="140" height="8" rx="2"/>
  <rect x="20" y="203" width="160" height="6" rx="1"/>
  <rect x="10" y="209" width="180" height="10" rx="2"/>
  <!-- Abacus wheel band -->
  <rect x="35" y="182" width="130" height="13" rx="3"/>
  <!-- Dharma Chakra (center wheel) -->
  <circle cx="100" cy="188" r="10" fill="none" stroke="#0B3D91" stroke-width="2"/>
  <line x1="100" y1="178" x2="100" y2="198" stroke="#0B3D91" stroke-width="1.2"/>
  <line x1="90" y1="188" x2="110" y2="188" stroke="#0B3D91" stroke-width="1.2"/>
  <line x1="93" y1="181" x2="107" y2="195" stroke="#0B3D91" stroke-width="1"/>
  <line x1="107" y1="181" x2="93" y2="195" stroke="#0B3D91" stroke-width="1"/>
  <!-- Capital/Bell shape -->
  <path d="M45,182 Q45,165 50,155 L55,140 Q60,130 65,125 L65,110 Q65,95 75,85 L75,70 Q80,55 100,45 Q120,55 125,70 L125,85 Q135,95 135,110 L135,125 Q140,130 145,140 L150,155 Q155,165 155,182 Z" fill="#0B3D91"/>
  <!-- Lion heads (simplified - 3 visible) -->
  <!-- Center lion -->
  <ellipse cx="100" cy="72" rx="16" ry="18" fill="#0B3D91"/>
  <rect x="92" y="54" width="16" height="6" rx="3" fill="#0B3D91"/>
  <!-- Left lion (side profile) -->
  <ellipse cx="72" cy="85" rx="14" ry="15" fill="#0B3D91" transform="rotate(-15, 72, 85)"/>
  <rect x="60" y="70" width="12" height="5" rx="2" fill="#0B3D91" transform="rotate(-15, 66, 72)"/>
  <!-- Right lion (side profile) -->
  <ellipse cx="128" cy="85" rx="14" ry="15" fill="#0B3D91" transform="rotate(15, 128, 85)"/>
  <rect x="128" y="70" width="12" height="5" rx="2" fill="#0B3D91" transform="rotate(15, 134, 72)"/>
  <!-- Lion mane details -->
  <circle cx="100" cy="62" r="10" fill="#0B3D91"/>
  <circle cx="74" cy="76" r="8" fill="#0B3D91"/>
  <circle cx="126" cy="76" r="8" fill="#0B3D91"/>
  <!-- Top crown piece -->
  <ellipse cx="100" cy="48" rx="8" ry="5" fill="#0B3D91"/>
  <!-- Small decorative elements on abacus -->
  <circle cx="55" cy="188" r="4" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="145" cy="188" r="4" fill="#FFFFFF" opacity="0.3"/>
  <!-- Bull figure (left side of abacus) -->
  <rect x="42" y="184" width="14" height="9" rx="2" fill="#FFFFFF" opacity="0.3"/>
  <!-- Horse figure (right side of abacus) -->
  <rect x="144" y="184" width="14" height="9" rx="2" fill="#FFFFFF" opacity="0.3"/>
  <!-- Text "सत्यमेव जयते" is part of the emblem -->
  <text x="100" y="235" text-anchor="middle" font-size="14" font-family="serif" fill="#0B3D91">सत्यमेव जयते</text>
</svg>
